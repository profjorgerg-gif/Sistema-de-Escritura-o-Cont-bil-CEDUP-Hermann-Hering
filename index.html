<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Escrituração Contábil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF0EA;
  --paper-raised:#F7F8F3;
  --ink:#1B3A4B;
  --ink-soft:#3E5A68;
  --line:#C9CFC3;
  --line-soft:#DEE2D8;
  --gold:#B8862B;
  --green:#2F6F5E;
  --red:#A23B2E;
  --credit:#7A4FA0;
  --shadow:0 1px 2px rgba(27,58,75,.06), 0 4px 14px rgba(27,58,75,.06);
  --radius:10px;
  font-size:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Public Sans', sans-serif;
  min-height:100vh;
}
h1,h2,h3,.serif{font-family:'Lora', serif;}
.mono{font-family:'IBM Plex Mono', monospace;}
::selection{background:var(--gold); color:#fff;}

.app{display:flex; min-height:100vh;}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:248px; flex:0 0 248px;
  background:linear-gradient(180deg, var(--ink) 0%, #142B38 100%);
  color:#EAF0EE;
  padding:22px 0 18px;
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
}
.brand{
  padding:0 20px 18px;
  border-bottom:1px solid rgba(234,240,238,.14);
  margin-bottom:10px;
}
.brand .mark{
  width:46px; height:46px; border-radius:50%; background:#fff;
  border:1.5px solid var(--gold);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  margin-bottom:10px; padding:3px; box-sizing:border-box;
}
.brand .mark img{ width:100%; height:100%; object-fit:contain; }
.brand h1{font-size:16.5px; line-height:1.25; margin:0 0 3px; font-weight:600; letter-spacing:.2px;}
.brand p{font-size:11.5px; margin:0; color:#9FB4B6; letter-spacing:.3px;}

nav{flex:1; padding:8px 10px; overflow-y:auto;}
.nav-item{
  display:flex; align-items:center; gap:11px;
  padding:10px 12px; margin-bottom:2px;
  border-radius:8px; cursor:pointer;
  color:#C7D6D3; font-size:13.5px; font-weight:500;
  transition:background .15s ease, color .15s ease;
  user-select:none;
}
.nav-item .num{
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:#6E8A8A;
  width:20px; flex:0 0 20px;
}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:rgba(184,134,43,.16); color:#fff;}
.nav-item.active .num{color:var(--gold);}
.nav-item.active{box-shadow:inset 3px 0 0 var(--gold);}

.sidebar-foot{
  padding:14px 20px 4px; font-size:10.5px; color:#6E8A8A;
  border-top:1px solid rgba(234,240,238,.1); margin-top:8px;
}

/* ---------- MAIN ---------- */
main{flex:1; min-width:0; padding:34px 42px 60px;}
.topbar{margin-bottom:26px;}
.back-btn{
  appearance:none; border:none; background:none; cursor:pointer; padding:0;
  display:inline-flex; align-items:center; gap:6px; margin-bottom:14px;
  font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600;
  color:var(--gold); letter-spacing:.3px;
}
.back-btn:hover{color:var(--ink); text-decoration:underline;}
.eyebrow{
  font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:1.5px;
  text-transform:uppercase; color:var(--gold); margin-bottom:6px; font-weight:600;
}
.topbar h2{font-size:26px; margin:0 0 6px; font-weight:600;}
.topbar .sub{color:var(--ink-soft); font-size:14px; max-width:640px; line-height:1.5;}
.rule{
  height:6px; margin:16px 0 26px; position:relative;
}
.rule::before, .rule::after{
  content:''; position:absolute; left:0; right:0; height:1px; background:var(--line);
}
.rule::before{top:0;} .rule::after{top:4px;}

.view{display:none;}
.view.active{display:block;}

.panel{
  background:var(--paper-raised); border:1px solid var(--line-soft);
  border-radius:var(--radius); box-shadow:var(--shadow); padding:22px 24px; margin-bottom:20px;
}
.panel h3{font-size:15px; margin:0 0 4px; font-weight:600;}
.panel .desc{color:var(--ink-soft); font-size:12.5px; margin:0 0 16px; line-height:1.5;}

/* forms */
.field-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; margin-bottom:14px;}
.field label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-soft); margin-bottom:6px; font-weight:600;}
.field input, .field select, .field textarea{
  width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:7px;
  background:#fff; font-family:'Public Sans',sans-serif; font-size:13.5px; color:var(--ink);
}
.field input:focus, .field select:focus, .field textarea:focus{
  outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(184,134,43,.15);
}
.field.wide{grid-column:1/-1;}
.btn{
  appearance:none; border:none; border-radius:7px; padding:10px 18px;
  font-family:'Public Sans',sans-serif; font-weight:600; font-size:13px; cursor:pointer;
  transition:transform .1s ease, box-shadow .1s ease;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--ink); color:#fff;}
.btn-primary:hover{background:#122834;}
.btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
.btn-ghost:hover{background:#fff;}
.btn-danger{background:transparent; color:var(--red); border:1px solid rgba(162,59,46,.35); padding:5px 10px; font-size:11.5px;}
.btn-danger:hover{background:rgba(162,59,46,.08);}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}

/* tables */
.table-wrap{overflow-x:auto; border:1px solid var(--line-soft); border-radius:8px;}
table{width:100%; border-collapse:collapse; font-size:13px;}
thead th{
  text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.5px;
  color:#EAF0EE; background:var(--ink); padding:10px 12px; font-weight:600; white-space:nowrap;
}
tbody td{padding:8px 12px; border-bottom:1px solid var(--line-soft); vertical-align:middle;}
tbody tr:hover{background:#fbf9f2;}
tbody tr:last-child td{border-bottom:none;}
td.num, th.num{text-align:right; font-family:'IBM Plex Mono',monospace; white-space:nowrap;}
td.code, th.code{font-family:'IBM Plex Mono',monospace; white-space:nowrap; color:var(--ink-soft);}
.row-total td{font-weight:700; background:#F1EEE3; border-top:2px solid var(--ink);}
.row-group td{font-weight:700; background:#E4E9DF;}
.row-subgroup td{font-weight:600; background:#EFF2E9;}
.pill{
  display:inline-block; padding:2px 9px; border-radius:20px; font-size:10.5px; font-weight:600;
  letter-spacing:.3px;
}
.pill-dev{background:rgba(47,111,94,.13); color:var(--green);}
.pill-cred{background:rgba(122,79,160,.13); color:var(--credit);}
.pill-var{background:rgba(184,134,43,.15); color:var(--gold);}
.pill-comp{background:#e6e6e6; color:#555;}
.pill-danger{background:rgba(162,59,46,.13); color:var(--red);}
.pill-mestre{background:var(--gold); color:#fff;}

.perm-panel{
  margin-top:12px; padding:12px 14px; background:#F1EEE3; border-radius:8px;
  border:1px solid var(--line); width:100%;
}
.perm-panel-title{font-size:11.5px; font-weight:700; color:var(--ink); margin-bottom:8px; text-transform:uppercase; letter-spacing:.4px;}
.perm-item{display:flex; align-items:center; gap:8px; font-size:12px; padding:5px 0; cursor:pointer;}
.perm-item input{width:15px; height:15px; accent-color:var(--gold); cursor:pointer;}

.backup-icon{
  flex:0 0 auto; width:52px; height:52px; border-radius:50%; background:#F1EEE3;
  border:1.5px solid var(--gold); color:var(--gold);
  display:flex; align-items:center; justify-content:center;
}

.search-row{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center;}
.search-row input[type=text]{flex:1; min-width:200px;}

/* stamp */
.stamp{
  display:inline-flex; align-items:center; justify-content:center; flex-direction:column;
  width:108px; height:108px; border-radius:50%;
  border:3px double currentColor; transform:rotate(-9deg);
  font-family:'IBM Plex Mono',monospace; font-weight:700; text-transform:uppercase;
  letter-spacing:1px; font-size:12px; text-align:center; line-height:1.3;
  float:right; margin:-6px 0 12px 16px;
}
.stamp.ok{color:var(--green);}
.stamp.bad{color:var(--red);}
.stamp small{display:block; font-size:9px; font-weight:600; letter-spacing:1.5px; opacity:.85;}

.kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:20px;}
.kpi{
  background:var(--paper-raised); border:1px solid var(--line-soft); border-radius:var(--radius);
  padding:16px 18px; box-shadow:var(--shadow);
}
.kpi .label{font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-soft); font-weight:600; margin-bottom:6px;}
.kpi .value{font-family:'IBM Plex Mono',monospace; font-size:21px; font-weight:600;}
.kpi .value.pos{color:var(--green);}
.kpi .value.neg{color:var(--red);}

.dre-line{display:flex; justify-content:space-between; padding:9px 4px; border-bottom:1px solid var(--line-soft); font-size:13.5px;}
.dre-line.indent{padding-left:18px; color:var(--ink-soft);}
.dre-line.subtotal{font-weight:700; background:#F1EEE3; border-radius:6px; padding:9px 10px; margin:4px 0;}
.dre-line.final{font-weight:700; background:var(--ink); color:#fff; border-radius:6px; padding:12px 14px; font-size:14.5px; margin-top:6px;}
.dre-line .val{font-family:'IBM Plex Mono',monospace;}

.bp-cols{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
@media(max-width:820px){.bp-cols{grid-template-columns:1fr;}}
.bp-col h4{font-family:'Lora',serif; font-size:14px; margin:0 0 10px; padding-bottom:8px; border-bottom:2px solid var(--ink);}
.bp-row{display:flex; justify-content:space-between; padding:8px 2px; border-bottom:1px solid var(--line-soft); font-size:13.5px;}
.bp-row.total{font-weight:700; border-top:2px solid var(--ink); border-bottom:none; margin-top:4px; padding-top:10px;}
.bp-row .val{font-family:'IBM Plex Mono',monospace;}

.hint{
  font-size:11.5px; color:var(--ink-soft); background:#F1EEE3; border-radius:8px;
  padding:10px 14px; margin-top:14px; line-height:1.5;
}
.hint b{color:var(--ink);}

/* context bar */
.context-bar{
  display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end;
  background:#E4E9DF; border:1px solid var(--line); border-radius:10px;
  padding:12px 16px; margin-bottom:0;
}
.context-bar .ctx-field{display:flex; flex-direction:column; gap:4px; min-width:220px; flex:1;}
.context-bar label{font-size:10px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-soft); font-weight:700;}
.context-bar select{padding:8px 10px; border-radius:7px; border:1px solid var(--line); background:#fff; font-size:13px; font-family:'Public Sans',sans-serif;}
.context-bar .ctx-tag{
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft);
  align-self:center; padding-bottom:9px;
}
.context-bar .ctx-empty{color:var(--red); font-weight:600; font-size:12.5px; align-self:center;}

/* entity cards (usuários / empresas) */
.entity-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; margin-top:6px;}
.entity-card{
  background:#fff; border:1px solid var(--line-soft); border-radius:10px; padding:14px 16px;
  display:flex; flex-direction:column; gap:6px; position:relative;
}
.entity-card.is-active{border-color:var(--gold); box-shadow:0 0 0 2px rgba(184,134,43,.18);}
.entity-card .tag{position:absolute; top:12px; right:14px;}
.entity-card h4{margin:0; font-size:14.5px; font-family:'Lora',serif; padding-right:70px;}
.entity-card .meta{font-size:12px; color:var(--ink-soft); line-height:1.5;}
.entity-card .actions{display:flex; gap:8px; margin-top:8px;}

/* introdução à contabilidade */
.intro-subnav{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px;}
.intro-subnav button{
  appearance:none; border:1px solid var(--line); background:#fff; color:var(--ink-soft);
  padding:8px 15px; border-radius:20px; font-family:'Public Sans',sans-serif; font-size:12.5px;
  font-weight:600; cursor:pointer; transition:all .15s ease;
}
.intro-subnav button:hover{border-color:var(--gold); color:var(--ink);}
.intro-subnav button.active{background:var(--ink); border-color:var(--ink); color:#fff;}

.concept-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px;}
.concept-card{
  background:#fff; border:1px solid var(--line-soft); border-radius:10px; padding:16px 18px;
  border-left:4px solid var(--gold);
}
.concept-card h4{margin:0 0 6px; font-family:'Lora',serif; font-size:15px;}
.concept-card p{margin:0; font-size:12.5px; color:var(--ink-soft); line-height:1.55;}

.bp-diagram{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:18px 0;}
@media(max-width:760px){.bp-diagram{grid-template-columns:1fr;}}
.bp-diagram .side{border:2px solid var(--ink); border-radius:10px; overflow:hidden;}
.bp-diagram .side-head{background:var(--ink); color:#fff; text-align:center; padding:9px; font-family:'Lora',serif; font-weight:600; font-size:14px;}
.bp-diagram .block{padding:14px 16px; border-bottom:1px solid var(--line-soft); font-size:12.5px;}
.bp-diagram .block:last-child{border-bottom:none;}
.bp-diagram .block b{display:block; font-size:13px; margin-bottom:3px; font-family:'Lora',serif;}
.bp-diagram .block.pl{background:#F1EEE3;}
.equation{
  text-align:center; font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:600;
  background:var(--ink); color:#fff; border-radius:10px; padding:16px; margin:14px 0;
  letter-spacing:1px;
}
.equation .op{color:var(--gold); margin:0 10px;}

.vs-table{width:100%; border-collapse:collapse; margin-top:10px;}
.vs-table th{background:var(--ink); color:#fff; padding:9px 12px; font-size:11.5px; text-transform:uppercase; letter-spacing:.4px;}
.vs-table td{padding:9px 12px; border-bottom:1px solid var(--line-soft); font-size:12.5px; vertical-align:top;}

.method-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin-bottom:20px;}
.method-card{background:#fff; border:1px solid var(--line-soft); border-radius:10px; padding:16px 18px;}
.method-card h4{margin:0 0 4px; font-family:'Lora',serif; font-size:14.5px;}
.method-card .sigla{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--gold); font-weight:700; letter-spacing:1px;}
.method-card p{font-size:12px; color:var(--ink-soft); line-height:1.55; margin:6px 0 0;}
.method-card .warn{font-size:11px; color:var(--red); margin-top:8px; font-weight:600;}

.kardex-cols{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
@media(max-width:960px){.kardex-cols{grid-template-columns:1fr;}}
.kardex-col h5{font-family:'Lora',serif; font-size:13.5px; margin:0 0 8px; text-align:center; padding-bottom:8px; border-bottom:2px solid var(--ink);}
.kardex-col table{font-size:11px;}
.kardex-col th, .kardex-col td{padding:5px 6px;}

/* impressão */
#printArea{display:none;}
@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{display:block !important; position:absolute; left:0; top:0; width:100%; padding:10px 20px;}
  #printArea .panel{box-shadow:none; border:1px solid #999; break-inside:avoid; margin-bottom:16px;}
  #printArea .stamp{float:none; margin:0 0 10px;}
}

/* ---------- CAPA ---------- */
.nav-home{border-top:none;}
.nav-divider{height:1px; background:rgba(234,240,238,.14); margin:6px 14px 10px;}

.cover{
  background:linear-gradient(160deg, var(--ink) 0%, #0F232D 62%, #142B38 100%);
  color:#EAF0EE; border-radius:16px; padding:52px 46px 46px; position:relative; overflow:hidden;
  box-shadow:var(--shadow); margin-bottom:24px;
}
.cover::before{
  content:''; position:absolute; inset:0; opacity:.05; pointer-events:none;
  background-image:repeating-linear-gradient(0deg, #fff 0 1px, transparent 1px 34px);
}
.cover-top{display:flex; justify-content:space-between; align-items:flex-start; gap:24px; flex-wrap:wrap; position:relative;}
.cover-eyebrow{font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:2px; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:14px;}
.cover h1{font-size:clamp(28px,4vw,44px); margin:0 0 12px; line-height:1.15; max-width:640px;}
.cover .tagline{font-size:15px; color:#B9CBC8; max-width:520px; line-height:1.6; margin:0 0 26px;}
.cover-cta{display:flex; gap:12px; flex-wrap:wrap; position:relative;}
.cover-cta .btn-primary{background:var(--gold); color:#1B2A20; padding:12px 22px; font-size:13.5px;}
.cover-cta .btn-primary:hover{background:#CB9A3B;}
.cover-cta .btn-ghost{border-color:rgba(234,240,238,.3); color:#EAF0EE;}
.cover-cta .btn-ghost:hover{background:rgba(255,255,255,.08);}

.cover-kpis{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:1px;
  background:rgba(234,240,238,.14); border-radius:12px; overflow:hidden; margin-top:34px; position:relative;
}
.cover-kpis .k{background:rgba(255,255,255,.03); padding:16px 18px;}
.cover-kpis .k .label{font-size:10px; text-transform:uppercase; letter-spacing:.6px; color:#8FA6A3; font-weight:600; margin-bottom:6px;}
.cover-kpis .k .value{font-family:'IBM Plex Mono',monospace; font-size:17px; font-weight:600; color:#fff;}

.cover-menu-title{display:flex; align-items:baseline; justify-content:space-between; margin:6px 0 14px;}
.cover-menu-title h3{margin:0; font-size:16px;}
.cover-menu-title span{font-size:11.5px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace;}
.module-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px;}
.module-card{
  background:var(--paper-raised); border:1px solid var(--line-soft); border-radius:10px; padding:15px 16px;
  cursor:pointer; transition:border-color .15s ease, transform .1s ease;
  display:flex; gap:12px; align-items:flex-start;
}
.module-card:hover{border-color:var(--gold); transform:translateY(-1px);}
.module-card .n{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--gold); font-weight:700; flex:0 0 22px; padding-top:2px;}
.module-card h4{margin:0 0 4px; font-size:13.5px; font-family:'Lora',serif;}
.module-card p{margin:0; font-size:11.5px; color:var(--ink-soft); line-height:1.5;}

/* manual do aluno */
.steps-list{counter-reset:step; display:flex; flex-direction:column; gap:12px;}
.step-item{display:flex; gap:14px; align-items:flex-start;}
.step-item .step-n{
  counter-increment:step; flex:0 0 30px; height:30px; border-radius:50%; background:var(--ink); color:#fff;
  display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:700;
}
.step-item .step-n::before{content:counter(step);}
.step-item .step-body h4{margin:0 0 3px; font-size:13.5px; font-family:'Lora',serif;}
.step-item .step-body p{margin:0; font-size:12.5px; color:var(--ink-soft); line-height:1.55;}

.faq-item{border-bottom:1px solid var(--line-soft); padding:14px 2px;}
.faq-item:last-child{border-bottom:none;}
.faq-item h4{margin:0 0 6px; font-size:13.5px; font-family:'Lora',serif; color:var(--ink);}
.faq-item h4::before{content:'P: '; color:var(--gold);}
.faq-item p{margin:0; font-size:12.5px; color:var(--ink-soft); line-height:1.6;}
.faq-item p::before{content:'R: '; color:var(--green); font-weight:700;}

.empty{padding:30px 10px; text-align:center; color:var(--ink-soft); font-size:13px;}

.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-soft); margin-top:10px;}
.legend span{display:inline-flex; align-items:center; gap:6px;}
.legend i{width:10px; height:10px; border-radius:3px; display:inline-block;}

.badge-count{
  background:var(--gold); color:#fff; font-size:10px; font-weight:700; border-radius:10px;
  padding:1px 7px; margin-left:auto;
}
@media(max-width:900px){
  .sidebar{position:fixed; z-index:20; transform:translateX(-100%); transition:transform .2s ease;}
  .sidebar.open{transform:translateX(0);}
  main{padding:22px 16px 50px;}
  .menu-toggle{display:inline-flex !important;}
}
.menu-toggle{
  display:none; align-items:center; gap:8px; background:var(--ink); color:#fff; border:none;
  padding:9px 14px; border-radius:7px; font-size:12.5px; font-weight:600; margin-bottom:16px; cursor:pointer;
}
</style>
</head>
<body>
<div class="app">

/* Armazenamento local do navegador (funciona em qualquer hospedagem, sem precisar do Claude).
   Os dados ficam salvos no dispositivo/navegador de cada aluno — não sincronizam entre aparelhos. */
async function safeGet(key){
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
async function safeSet(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }
  catch(e){ console.error('Falha ao salvar', key, e); }
}
async function loadState(){

/* ===================== HELPERS DE FORMATAÇÃO ===================== */
function money(n){
  const v = Number(n)||0;
  const s = Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  return (v<0?'-':'') + 'R$\u00A0' + s;
}
function num(n){
  const v = Number(n)||0;
  return v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(d){
  if(!d) return '';
  const parts = d.split('-');
  if(parts.length===3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
  return d;
}

/* ===================== MOTOR DE CÁLCULO (escopo: empresa ativa) ===================== */
function totalDebPrefix(prefix){
  return getLanc().reduce((s,l)=> s + (l.contaDebito && l.contaDebito.startsWith(prefix+'.') ? Number(l.valor):0), 0);
}
function totalCredPrefix(prefix){
  return getLanc().reduce((s,l)=> s + (l.contaCredito && l.contaCredito.startsWith(prefix+'.') ? Number(l.valor):0), 0);
}
function saldoInicialPrefixSide(prefix, side){
  const saldos = getSaldos();
  let s=0;
  for(const cod in saldos){
    if(cod.startsWith(prefix+'.')){ s += Number((saldos[cod]||{})[side]||0); }
  }
  return s;
}
function debMinusCredPrefix(prefix){
  const mov = totalDebPrefix(prefix) - totalCredPrefix(prefix);
  const ini = saldoInicialPrefixSide(prefix,'devedor') - saldoInicialPrefixSide(prefix,'credor');
  return mov + ini;
}
function credMinusDebPrefix(prefix){
  const mov = totalCredPrefix(prefix) - totalDebPrefix(prefix);
  const ini = saldoInicialPrefixSide(prefix,'credor') - saldoInicialPrefixSide(prefix,'devedor');
  return mov + ini;
}
function totalDebConta(codigo){
  const mov = getLanc().reduce((s,l)=> s + (l.contaDebito===codigo?Number(l.valor):0), 0);
  const ini = Number((getSaldos()[codigo]||{}).devedor || 0);
  return mov + ini;
}
function totalCredConta(codigo){
  const mov = getLanc().reduce((s,l)=> s + (l.contaCredito===codigo?Number(l.valor):0), 0);
  const ini = Number((getSaldos()[codigo]||{}).credor || 0);
  return mov + ini;
}
function saldoConta(codigo){
  const conta = CONTA_BY_CODE[codigo];
  const deb = totalDebConta(codigo), cred = totalCredConta(codigo);
  if(!conta) return {deb,cred,dev:0,cre:0};
  if(conta.natureza==='Devedora'){
    return deb>=cred ? {deb,cred,dev:deb-cred,cre:0} : {deb,cred,dev:0,cre:cred-deb};
  } else if(conta.natureza==='Credora'){
    return cred>=deb ? {deb,cred,dev:0,cre:cred-deb} : {deb,cred,dev:deb-cred,cre:0};
  }
  return deb>=cred ? {deb,cred,dev:deb-cred,cre:0} : {deb,cred,dev:0,cre:cred-deb};
}
function computeDRE(){

  const despFin = -debMinusCredPrefix('5.3');

  const ganhosCapital = credMinusDebPrefix('4.5') + credMinusDebPrefix('4.6');
  const outrasDesp = -debMinusCredPrefix('5.4');
  const resAntesIRPJ = resOperacional + ganhosCapital + outrasDesp;
  const provIRPJCSLL = -debMinusCredPrefix('7.2');
  const resultadoLiquido = resAntesIRPJ + provIRPJCSLL;
  return {receitaBruta,deducoes,receitaLiquida,cmv,resultadoBruto,despAdm,despCom,outrasReceitasOp,
    resAntesFin,receitasFin,despFin,resOperacional,ganhosCapital,outrasDesp,resAntesIRPJ,provIRPJCSLL,resultadoLiquido};
}


/* ===================== CONTROLE DE ESTOQUE: PEPS / UEPS / MÉDIA PONDERADA ===================== */
function computeKardexPEPS(movs){
  let lots = [], cmvTotal = 0;
  const rows = movs.map(m=>{
    let obs = '';
    if(m.tipo==='Entrada'){
      lots.push({qtd:Number(m.quantidade), valorUnit:Number(m.valorUnit)});
    } else {
      let falta = Number(m.quantidade), custo = 0;
      while(falta>0.0001 && lots.length){
        const lot = lots[0];
        if(lot.qtd<=falta+0.0001){ custo += lot.qtd*lot.valorUnit; falta -= lot.qtd; lots.shift(); }
        else { custo += falta*lot.valorUnit; lot.qtd -= falta; falta = 0; }
      }
      if(falta>0.0001) obs = 'estoque insuficiente';
      cmvTotal += custo;
      m = {...m, custoSaida:custo};
    }
    const saldoQtd = lots.reduce((s,l)=>s+l.qtd,0);
    const saldoValor = lots.reduce((s,l)=>s+l.qtd*l.valorUnit,0);
    return {...m, saldoQtd, saldoValor, obs};
  });
  return {rows, estoqueFinalQtd: lots.reduce((s,l)=>s+l.qtd,0), estoqueFinalValor: lots.reduce((s,l)=>s+l.qtd*l.valorUnit,0), cmvTotal};
}
function computeKardexUEPS(movs){
  let lots = [], cmvTotal = 0;
  const rows = movs.map(m=>{
    let obs = '';
    if(m.tipo==='Entrada'){
      lots.push({qtd:Number(m.quantidade), valorUnit:Number(m.valorUnit)});
    } else {
      let falta = Number(m.quantidade), custo = 0;
      while(falta>0.0001 && lots.length){
        const lot = lots[lots.length-1];
        if(lot.qtd<=falta+0.0001){ custo += lot.qtd*lot.valorUnit; falta -= lot.qtd; lots.pop(); }
        else { custo += falta*lot.valorUnit; lot.qtd -= falta; falta = 0; }
      }
      if(falta>0.0001) obs = 'estoque insuficiente';
      cmvTotal += custo;
      m = {...m, custoSaida:custo};
    }
    const saldoQtd = lots.reduce((s,l)=>s+l.qtd,0);
    const saldoValor = lots.reduce((s,l)=>s+l.qtd*l.valorUnit,0);
    return {...m, saldoQtd, saldoValor, obs};
  });
  return {rows, estoqueFinalQtd: lots.reduce((s,l)=>s+l.qtd,0), estoqueFinalValor: lots.reduce((s,l)=>s+l.qtd*l.valorUnit,0), cmvTotal};
}
function computeKardexMP(movs){
  let qtd = 0, valorTotal = 0, cmvTotal = 0;
  const rows = movs.map(m=>{
    let obs = '';
    if(m.tipo==='Entrada'){
      qtd += Number(m.quantidade);
      valorTotal += Number(m.quantidade)*Number(m.valorUnit);
    } else {
      if(Number(m.quantidade) > qtd + 0.0001) obs = 'estoque insuficiente';
      const custoUnitAtual = qtd>0 ? valorTotal/qtd : 0;
      const custoSaida = Math.min(Number(m.quantidade), qtd)*custoUnitAtual;
      cmvTotal += custoSaida;
      qtd -= Math.min(Number(m.quantidade), qtd);
      valorTotal -= custoSaida;
      m = {...m, custoSaida};
    }
    return {...m, saldoQtd:qtd, saldoValor:valorTotal, obs};
  });
  return {rows, estoqueFinalQtd:qtd, estoqueFinalValor:valorTotal, cmvTotal};
}

function renderIntroducao(){
  const el = document.getElementById('view-introducao');
  let content;
  if(introSub==='principios') content = renderPrincipios();
  else if(introSub==='classificacao') content = renderClassificacao();
  else if(introSub==='estruturabp') content = renderEstruturaBP();
  else if(introSub==='regimes') content = renderRegimes();
  else content = renderEstoque();
  el.innerHTML = introSubnav() + content;

  if(introSub==='estoque'){
    const form = document.getElementById('formEstoque');
    const tipoSel = document.getElementById('estoqueTipo');
    const campoValorUnit = document.getElementById('campoValorUnit');
    const toggleValorUnit = () => { campoValorUnit.style.display = tipoSel.value==='Entrada' ? 'flex' : 'none'; };
    toggleValorUnit();
    tipoSel.addEventListener('change', toggleValorUnit);
    form.addEventListener('submit', async e=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      const tipo = fd.get('tipo'), quantidade = Number(fd.get('quantidade'));
      const errEl = document.getElementById('estoqueErro');
      if(tipo==='Entrada' && !(Number(fd.get('valorUnit'))>0)){
        errEl.textContent = 'Informe o valor unitário da entrada.';
        return;
      }
      const saldoAtual = estoqueMovs.reduce((s,m)=> s + (m.tipo==='Entrada'?Number(m.quantidade):-Number(m.quantidade)), 0);
      if(tipo==='Saída' && quantidade > saldoAtual + 0.0001){
        errEl.textContent = `Estoque insuficiente: há apenas ${saldoAtual} unidade(s) disponível(is).`;
        return;
      }
      errEl.textContent = '';
      const novoMov = {id:uid('k'), data:fd.get('data'), tipo, quantidade, valorUnit: tipo==='Entrada'?Number(fd.get('valorUnit')):undefined};
      estoqueMovs.push(novoMov);
      await persistEstoque();
      registrarLog('criar', 'estoque', `Registrou movimentação de estoque: ${tipo} de ${quantidade} unidade(s)`, novoMov);
      renderIntroducao();
    });
  }
}
async function removerEstoqueMov(id){
  const removido = estoqueMovs.find(m=>m.id===id);
  estoqueMovs = estoqueMovs.filter(m=>m.id!==id);
  await persistEstoque();
  if(removido) registrarLog('excluir', 'estoque', `Excluiu movimentação de estoque: ${removido.tipo} de ${removido.quantidade} unidade(s)`, removido);
  renderIntroducao();
}
async function carregarExemploEstoque(){
  const novos = seedEstoqueMovs();
  estoqueMovs = estoqueMovs.concat(novos);
  await persistEstoque();
  registrarLog('criar', 'estoque', `Carregou ${novos.length} movimentações de estoque de exemplo`, {quantidade:novos.length});
  renderIntroducao();
}
async function limparEstoque(){
  if(!temPermissao('excluirLancamentos')){ alert('Você não tem permissão para excluir movimentações de estoque.'); return; }
  if(!confirm('Excluir todas as movimentações de estoque cadastradas?')) return;
  const removidos = estoqueMovs;
  registrarLog('excluir', 'estoque', `Excluiu TODAS as ${removidos.length} movimentações de estoque`, {quantidade:removidos.length, movimentacoes:removidos});
  estoqueMovs = [];
  await persistEstoque();
  renderIntroducao();
}

/* ---- exportação CSV e impressão ---- */
function slug(s){ return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').toLowerCase(); }
function csvEscape(v){ const s = String(v==null?'':v).replace(/"/g,'""'); return /[;"\n]/.test(s) ? `"${s}"` : s; }
function downloadCSV(filename, rows){
  const csv = '\uFEFF' + rows.map(r=>r.map(csvEscape).join(';')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function exportarDiarioCSV(){
  if(!empresaAtivaId) return;
  const rows = [['Data','Tipo de Operação','Histórico','Conta Débito','Nome Débito','Conta Crédito','Nome Crédito','Valor','Documento','Observações','Lançado por']];
  getLanc().forEach(l=>{
    const cd = CONTA_BY_CODE[l.contaDebito], cc = CONTA_BY_CODE[l.contaCredito];
    rows.push([fmtDate(l.data), l.tipoOperacao||'', l.historico, l.contaDebito, cd?cd.nome:'', l.contaCredito, cc?cc.nome:'', num(l.valor), l.documento||'', l.observacoes||'', usuarioNome(l.usuarioId)]);
  });
  downloadCSV(`livro_diario_${slug(empresaAtiva().nome)}.csv`, rows);
}
function exportarBalanceteCSV(){
  if(!empresaAtivaId) return;
  const rows = [['Código','Conta','Natureza','Total Débitos','Total Créditos','Saldo Devedor','Saldo Credor']];
  LEAVES.forEach(c=>{
    const s = saldoConta(c.codigo);
    if(s.deb!==0 || s.cred!==0) rows.push([c.codigo, c.nome, c.natureza, num(s.deb), num(s.cred), s.dev?num(s.dev):'', s.cre?num(s.cre):'']);
  });
  downloadCSV(`balancete_${slug(empresaAtiva().nome)}.csv`, rows);
}

function handleImportBackup(e){
  if(!temPermissao('restaurarBackup')){ alert('Você não tem permissão para restaurar backups.'); e.target.value=''; return; }
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    let data;
    try{ data = JSON.parse(ev.target.result); }
    catch(err){ alert('Não foi possível ler este arquivo. Verifique se é um backup válido gerado por este sistema.'); e.target.value=''; return; }
    if(!data || !Array.isArray(data.usuarios) || !Array.isArray(data.empresas)){
      alert('Este arquivo não parece ser um backup válido do Sistema de Escrituração Contábil.');
      e.target.value = '';
      return;
    }
    const resumo = `${data.usuarios.length} usuário(s), ${data.empresas.length} empresa(s)` +
      (data.exportadoEm ? `, gerado em ${new Date(data.exportadoEm).toLocaleString('pt-BR')}` : '');
    if(!confirm(`Restaurar este backup (${resumo}) vai SUBSTITUIR todos os dados atualmente salvos neste aparelho. Deseja continuar?`)){
      e.target.value = '';
      return;
    }
    usuarios = data.usuarios || [];
    empresas = data.empresas || [];
    lancamentosPorEmpresa = data.lancamentosPorEmpresa || {};
    saldosPorEmpresa = data.saldosPorEmpresa || {};
    estoqueMovs = data.estoqueMovs || [];
    logAtividades = data.logAtividades || logAtividades || [];
    turmas = data.turmas || turmas || [];
    const ctx = data.contexto || {};
    usuarioAtivoId = (ctx.usuarioAtivoId && usuarios.some(u=>u.id===ctx.usuarioAtivoId)) ? ctx.usuarioAtivoId : (usuarios[0] ? usuarios[0].id : null);
    empresaAtivaId = (ctx.empresaAtivaId && empresas.some(x=>x.id===ctx.empresaAtivaId)) ? ctx.empresaAtivaId : (empresas[0] ? empresas[0].id : null);
    await persistUsuarios();
    await persistEmpresas();
    await persistContexto();
    await persistLancamentos();
    await persistSaldos();
    await persistEstoque();
    await persistTurmas();
    registrarLog('editar', 'sistema', `Restaurou um backup (${resumo})`, {resumo});
    e.target.value = '';
    renderNav(); renderTopbar(); renderContextBar(); renderAll();
    alert('Backup restaurado com sucesso.');
  };
  reader.readAsText(file, 'utf-8');
}

function acaoPill(acao){
  if(acao==='criar') return `<span class="pill pill-dev">Criação</span>`;
  if(acao==='editar') return `<span class="pill pill-var">Edição</span>`;
  if(acao==='excluir') return `<span class="pill pill-danger">Exclusão</span>`;
  return `<span class="pill pill-comp">${esc(acao)}</span>`;
}
function fmtDateTime(iso){
  const d = new Date(iso);
  if(isNaN(d.getTime())) return iso;
  return d.toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function renderAuditoria(){
  const el = document.getElementById('view-auditoria');
  if(!temPermissao('verAuditoria')){
    el.innerHTML = `<div class="panel empty">Você não tem permissão para ver o log de Auditoria. Peça a um usuário <b>Mestre</b> ou <b>Professor</b> para consultar ou liberar essa permissão para você.</div>`;
    return;
  }
  const usuariosNoLog = [...new Set(logAtividades.map(l=>l.usuarioNome))].filter(Boolean).sort();
  const empresasNoLog = [...new Set(logAtividades.map(l=>l.empresaNome))].filter(Boolean).sort();
  const linhas = logAtividades
    .filter(l => !logFiltroUsuario || l.usuarioNome===logFiltroUsuario)
    .filter(l => !logFiltroEmpresa || l.empresaNome===logFiltroEmpresa)
    .filter(l => !logFiltroAcao || l.acao===logFiltroAcao)
    .slice().sort((a,b)=> b.timestamp.localeCompare(a.timestamp));
  const nExclusoes = logAtividades.filter(l=>l.acao==='excluir').length;
  el.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi"><div class="label">Total de registros</div><div class="value">${logAtividades.length}</div></div>

      <div class="kpi"><div class="label">Usuários com atividade</div><div class="value">${usuariosNoLog.length}</div></div>
      <div class="kpi"><div class="label">Empresas com atividade</div><div class="value">${empresasNoLog.length}</div></div>
    </div>
    <div class="panel">
      <h3>Log de atividades</h3>
      <p class="desc">Todo lançamento, cadastro ou exclusão feito no sistema fica registrado aqui automaticamente, com data/hora, usuário e empresa — e não pode ser apagado pela interface. Use os filtros para investigar uma ação específica.</p>
      <div class="search-row">
        <select id="logFiltroUsuario" style="max-width:220px;">
          <option value="">Todos os usuários</option>
          ${usuariosNoLog.map(n=>`<option value="${esc(n)}" ${n===logFiltroUsuario?'selected':''}>${esc(n)}</option>`).join('')}
        </select>
        <select id="logFiltroEmpresa" style="max-width:220px;">
          <option value="">Todas as empresas</option>
          ${empresasNoLog.map(n=>`<option value="${esc(n)}" ${n===logFiltroEmpresa?'selected':''}>${esc(n)}</option>`).join('')}
        </select>
        <select id="logFiltroAcao" style="max-width:180px;">
          <option value="">Todas as ações</option>
          <option value="criar" ${logFiltroAcao==='criar'?'selected':''}>Criação</option>
          <option value="editar" ${logFiltroAcao==='editar'?'selected':''}>Edição</option>
          <option value="excluir" ${logFiltroAcao==='excluir'?'selected':''}>Exclusão</option>
        </select>
        <button class="btn btn-ghost" onclick="exportarLogCSV()">Exportar log (CSV)</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Data/Hora</th><th>Usuário</th><th>Empresa</th><th>Ação</th><th>Descrição</th></tr></thead>
          <tbody>
          ${linhas.length ? linhas.map(l=>`
            <tr>
              <td style="white-space:nowrap;">${fmtDateTime(l.timestamp)}</td>
              <td>${esc(l.usuarioNome)}</td>
              <td>${esc(l.empresaNome)}</td>
              <td>${acaoPill(l.acao)}</td>
              <td>${esc(l.descricao)}</td>
            </tr>`).join('') : `<tr><td colspan="5" class="empty">Nenhum registro encontrado com esses filtros.</td></tr>`}
          </tbody>
        </table>
      </div>

    </div>`;
  document.getElementById('logFiltroUsuario').addEventListener('change', e=>{ logFiltroUsuario = e.target.value; renderAuditoria(); });
  document.getElementById('logFiltroEmpresa').addEventListener('change', e=>{ logFiltroEmpresa = e.target.value; renderAuditoria(); });
  document.getElementById('logFiltroAcao').addEventListener('change', e=>{ logFiltroAcao = e.target.value; renderAuditoria(); });
}
function exportarLogCSV(){
  const rows = [['Data/Hora','Usuário','Empresa','Ação','Descrição']];
  logAtividades.slice().sort((a,b)=>a.timestamp.localeCompare(b.timestamp)).forEach(l=>{
    rows.push([fmtDateTime(l.timestamp), l.usuarioNome, l.empresaNome, l.acao, l.descricao]);
  });
  downloadCSV(`log_atividades_${new Date().toISOString().slice(0,10)}.csv`, rows);
}

/* ===================== RENDER: TURMAS ===================== */
let turmaEditandoId = null;
function renderTurmas(){
  const el = document.getElementById('view-turmas');
  const podeGerenciar = temPermissao('gerenciarTurmas');
  el.innerHTML = `
    ${podeGerenciar ? `
    <div class="panel">
      <h3>Nova turma</h3>
      <p class="desc">Cadastre aqui as turmas antes de adicionar usuários — cada usuário precisa ser vinculado a uma turma já existente.</p>
      <form id="formTurma">
        <div class="field-grid">
          <div class="field wide"><label>Nome da turma</label><input type="text" name="nome" required placeholder="Ex.: 3º ano — Técnico em Contabilidade"></div>
        </div>
        <div class="btn-row"><button type="submit" class="btn btn-primary">Adicionar turma</button></div>
      </form>
    </div>` : ''}
    <div class="panel">
      <h3 style="margin:0 0 12px;">Turmas cadastradas <span class="badge-count">${turmas.length}</span></h3>
      <div class="entity-grid">
        ${turmas.length ? turmas.map(t=>{
          const n = usuarios.filter(u=>u.turmaId===t.id).length;
          const editando = podeGerenciar && turmaEditandoId === t.id;
          return `<div class="entity-card">
            <span class="tag pill pill-var">${n} usuário(s)</span>
            ${editando ? `
              <form class="form-editar-turma" data-id="${t.id}" style="display:flex; flex-direction:column; gap:8px;">
                <input type="text" name="nome" value="${esc(t.nome)}" required style="padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px;">
                <div class="actions">
                  <button type="submit" class="btn btn-primary" style="padding:6px 10px;font-size:11.5px;">Salvar</button>
                  <button type="button" class="btn btn-ghost" style="padding:6px 10px;font-size:11.5px;" onclick="toggleEditarTurma(null)">Cancelar</button>
                </div>
              </form>` : `
              <h4>${esc(t.nome)}</h4>
              <div class="actions">
                ${podeGerenciar ? `<button class="btn btn-ghost" style="padding:6px 10px;font-size:11.5px;" onclick="toggleEditarTurma('${t.id}')">Editar</button>` : ''}
                ${podeGerenciar ? `<button class="btn-danger" onclick="removerTurma('${t.id}')">Excluir</button>` : ''}
              </div>`}
          </div>`;}).join('') : `<div class="empty">Nenhuma turma cadastrada ainda.</div>`}
      </div>
      ${!podeGerenciar ? `<div class="hint">Você não tem permissão para cadastrar, editar ou excluir turmas. Peça a um usuário <b>Mestre</b> ou <b>Professor</b>.</div>` : ''}
      ${!turmas.length ? `<div class="hint"><b>Atenção:</b> nenhum usuário novo pode ser cadastrado enquanto não houver ao menos uma turma aqui.</div>` : ''}
    </div>`;
  const form = document.getElementById('formTurma');
  if(form){
    form.addEventListener('submit', async e=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      const nova = {id:uid('t'), nome:fd.get('nome')};
      turmas.push(nova);
      await persistTurmas();
      registrarLog('criar', 'turma', `Cadastrou turma: ${nova.nome}`, nova);
      e.target.reset();
      renderAll();
    });
  }
  el.querySelectorAll('.form-editar-turma').forEach(f=>{
    f.addEventListener('submit', async e=>{
      e.preventDefault();
      if(!temPermissao('gerenciarTurmas')){ alert('Você não tem permissão para editar turmas.'); return; }
      const id = e.target.dataset.id;
      const novoNome = new FormData(e.target).get('nome').trim();
      const alvo = turmas.find(t=>t.id===id);
      if(!alvo || !novoNome) return;
      const nomeAntigo = alvo.nome;
      alvo.nome = novoNome;
      await persistTurmas();
      registrarLog('editar', 'turma', `Renomeou turma: "${nomeAntigo}" → "${novoNome}"`, {id, nomeAntigo, novoNome});
      turmaEditandoId = null;
      renderAll();
    });
  });
}
function toggleEditarTurma(id){
  turmaEditandoId = id;
  renderTurmas();
}
async function removerTurma(id){
  if(!temPermissao('gerenciarTurmas')){ alert('Você não tem permissão para excluir turmas.'); return; }
  const emUso = usuarios.filter(u=>u.turmaId===id);
  if(emUso.length){
    alert(`Não é possível excluir esta turma: ${emUso.length} usuário(s) ainda estão vinculados a ela. Mude a turma desses usuários primeiro (edite ou exclua-os) antes de excluir a turma.`);
    return;
  }
  if(!confirm('Excluir esta turma?')) return;
  const removida = turmas.find(t=>t.id===id);
  turmas = turmas.filter(t=>t.id!==id);
  await persistTurmas();
  if(removida) registrarLog('excluir', 'turma', `Excluiu turma: ${removida.nome}`, removida);
  renderAll();
}

      if(!turmaId){ alert('Selecione uma turma para o usuário.'); return; }
      const novo = {id:uid('u'), nome:fd.get('nome'), tipo, identificacao:fd.get('identificacao'), turmaId, permissoes: defaultPermissoes(tipo)};

  });

function renderPainelPermissoes(u){

function togglePermissoes(id){

async function definirUsuarioAtivo(id){
  const novo = usuarios.find(u=>u.id===id);
  usuarioAtivoId = id;

  if(novo) registrarLog('editar', 'contexto', `Trocou o usuário ativo para: ${novo.nome}`, null);

async function removerUsuario(id){
  const alvo = usuarios.find(u=>u.id===id);
  if(!temPermissao('excluirUsuarios')){ alert('Você não tem permissão para excluir usuários.'); return; }
  if(alvo && alvo.tipo==='Mestre' && contarMestres()<=1){ alert('Não é possível excluir o único usuário Mestre do sistema.'); return; }
  if(!confirm('Excluir este usuário? Os lançamentos já registrados por ele são mantidos, apenas deixam de referenciar um usuário ativo.')) return;
  const removido = usuarios.find(u=>u.id===id);
  usuarios = usuarios.filter(u=>u.id!==id);
  if(usuarioAtivoId===id) usuarioAtivoId = usuarios.length ? usuarios[0].id : null;
  await persistUsuarios();
  await persistContexto();
  if(removido) registrarLog('excluir', 'usuario', `Excluiu usuário: ${removido.nome} (${removido.tipo})`, removido);
  renderAll();
}

async function removerEmpresa(id){
  if(!temPermissao('excluirEmpresas')){ alert('Você não tem permissão para excluir empresas.'); return; }
  if(!confirm('Excluir esta empresa e TODOS os seus lançamentos e saldos iniciais? Esta ação não pode ser desfeita.')) return;
  const removida = empresas.find(e=>e.id===id);
  const lancPerdidos = lancamentosPorEmpresa[id] || [];
  empresas = empresas.filter(e=>e.id!==id);
  delete lancamentosPorEmpresa[id];
  delete saldosPorEmpresa[id];
  if(empresaAtivaId===id) empresaAtivaId = empresas.length ? empresas[0].id : null;
  await persistEmpresas();
  await persistLancamentos();
  await persistSaldos();
  await persistContexto();
  if(removida) registrarLog('excluir', 'empresa', `Excluiu empresa: ${removida.nome} (e seus ${lancPerdidos.length} lançamentos)`, {empresa:removida, lancamentosPerdidos:lancPerdidos});

function renderSaldos(){
  const el = document.getElementById('view-saldos');
  if(!empresaAtivaId){ el.innerHTML = `<div class="panel empty">Selecione uma empresa ativa na barra acima.</div>`; return; }
  const saldos = getSaldos();
  const rows = LEAVES.filter(c=>{
    if(!filtroSaldos) return true;
    const f = filtroSaldos.toLowerCase();
    return c.codigo.toLowerCase().includes(f) || c.nome.toLowerCase().includes(f);
  });
  const totDev = LEAVES.reduce((s,c)=> s + Number((saldos[c.codigo]||{}).devedor||0),0);
  const totCred = LEAVES.reduce((s,c)=> s + Number((saldos[c.codigo]||{}).credor||0),0);
  el.innerHTML = `
    <div class="panel">
      <h3>Saldos de abertura — ${esc(empresaAtiva().nome)}</h3>
      <p class="desc">Preencha o saldo devedor OU credor de cada conta no início do período (deixe em branco as que não tiverem saldo).</p>

        <input type="text" id="filtroSaldosInput" placeholder="Buscar por código ou nome..." value="${esc(filtroSaldos)}">
        <button class="btn btn-primary" onclick="salvarSaldos()">Salvar saldos iniciais</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th class="code">Código</th><th>Conta</th><th>Natureza</th><th class="num">Saldo Devedor</th><th class="num">Saldo Credor</th></tr></thead>
          <tbody>
          ${rows.map(c=>{
            const cur = saldos[c.codigo] || {};
            return `<tr>
              <td class="code">${esc(c.codigo)}</td>
              <td>${esc(c.nome)}</td>
              <td>${pillFor(c.natureza)}</td>
              <td class="num"><input type="number" step="0.01" min="0" style="width:120px;text-align:right" data-code="${esc(c.codigo)}" data-side="devedor" value="${cur.devedor||''}"></td>
              <td class="num"><input type="number" step="0.01" min="0" style="width:120px;text-align:right" data-code="${esc(c.codigo)}" data-side="credor" value="${cur.credor||''}"></td>
            </tr>`;
          }).join('') || `<tr><td colspan="5" class="empty">Nenhuma conta encontrada.</td></tr>`}
          </tbody>
          <tfoot>
            <tr class="row-total"><td colspan="3">TOTAIS</td><td class="num">${num(totDev)}</td><td class="num">${num(totCred)}</td></tr>
          </tfoot>
        </table>
      </div>
      <div class="hint"><b>Verificação:</b> devedores = credores → ${Math.abs(totDev-totCred)<0.005?'<span style="color:var(--green);font-weight:700">OK</span>':'<span style="color:var(--red);font-weight:700">DIVERGENTE</span>'}</div>
    </div>`;
  document.getElementById('filtroSaldosInput').addEventListener('input', e=>{ filtroSaldos = e.target.value; renderSaldos(); });
  el.querySelectorAll('input[type=number]').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const code = e.target.dataset.code, side = e.target.dataset.side;
      const s = getSaldos();
      if(!s[code]) s[code] = {devedor:0, credor:0};
      s[code][side] = e.target.value===''?0:Number(e.target.value);
    });
  });
}

      <div class="btn-row" style="justify-content:space-between; margin-bottom:14px;">
        <h3 style="margin:0;">Livro Diário <span class="badge-count">${lanc.length}</span></h3>
        <div class="btn-row">
          <button class="btn btn-ghost" onclick="carregarExemplos()">Carregar exemplos</button>
          ${temPermissao('excluirLancamentos') ? `<button class="btn btn-ghost" onclick="limparLancamentos()">Limpar tudo</button>` : ''}
        </div>
      </div>
      <div class="search-row">
        <input type="text" id="filtroLancInput" placeholder="Buscar por histórico, conta, documento ou observação..." value="${esc(filtroLancTexto)}">
        <select id="filtroLancTipoSelect" style="max-width:200px;">
          <option value="">Todos os tipos</option>
          ${TIPOS_OPERACAO.map(t=>`<option value="${t}" ${filtroLancTipo===t?'selected':''}>${t}</option>`).join('')}
        </select>
      </div>
      ${(filtroLancTexto || filtroLancTipo) ? `<div class="hint" style="margin-bottom:10px;">Mostrando ${filtrados.length} de ${lanc.length} lançamento(s). <a href="#" onclick="limparFiltroLanc();return false;" style="color:var(--gold);">Limpar filtro</a></div>` : ''}
      <div class="table-wrap">
        <table>
          <thead><tr><th>Data</th><th>Tipo</th><th>Histórico</th><th class="code">Débito</th><th class="code">Crédito</th><th class="num">Valor</th><th>Documento</th><th>Lançado por</th><th></th></tr></thead>
          <tbody>
          ${filtrados.length ? filtrados.map(l=>{
            const cd = CONTA_BY_CODE[l.contaDebito], cc = CONTA_BY_CODE[l.contaCredito];
            return `<tr>
              <td>${fmtDate(l.data)}</td>
              <td>${l.tipoOperacao ? `<span class="pill pill-var">${esc(l.tipoOperacao)}</span>` : '—'}</td>
              <td>${esc(l.historico)}${l.observacoes?`<br><span style="color:var(--ink-soft);font-size:11.5px;">${esc(l.observacoes)}</span>`:''}</td>
              <td class="code" title="${cd?esc(cd.nome):''}">${esc(l.contaDebito)}</td>
              <td class="code" title="${cc?esc(cc.nome):''}">${esc(l.contaCredito)}</td>
              <td class="num">${money(l.valor)}</td>
              <td>${esc(l.documento||'')}</td>
              <td style="font-size:12px;color:var(--ink-soft)">${esc(usuarioNome(l.usuarioId))}</td>
              <td style="white-space:nowrap;">
                ${temPermissao('excluirLancamentos') ? `<button class="btn btn-ghost" style="padding:5px 8px;font-size:11px;" onclick="editarLancamento('${l.id}')">Editar</button>` : ''}
                ${temPermissao('excluirLancamentos') ? `<button class="btn-danger" onclick="removerLancamento('${l.id}')">Excluir</button>` : ''}
              </td>
            </tr>`;
          }).join('') : `<tr><td colspan="9" class="empty">${lanc.length ? 'Nenhum lançamento corresponde à busca.' : 'Nenhum lançamento registrado ainda para esta empresa.'}</td></tr>`}
          </tbody>
          ${lanc.length?`<tfoot><tr class="row-total"><td colspan="5">TOTAL LANÇADO NO PERÍODO</td><td class="num">${money(totalPeriodo)}</td><td colspan="3"></td></tr></tfoot>`:''}
        </table>
      </div>
      ${!temPermissao('excluirLancamentos') ? `<div class="hint">Você não tem permissão para editar ou excluir lançamentos. Peça a um usuário <b>Mestre</b> ou <b>Professor</b>.</div>` : ''}
    </div>`;

  document.getElementById('selectTipoOperacao').addEventListener('change', e=>{
    const inputHist = document.getElementById('inputHistorico');
    const sugestao = SUGESTAO_HISTORICO[e.target.value];
    if(sugestao && !inputHist.value.trim()) inputHist.value = sugestao;
  });
  document.getElementById('filtroLancInput').addEventListener('input', e=>{ filtroLancTexto = e.target.value; renderLancamentos(); });
  document.getElementById('filtroLancTipoSelect').addEventListener('change', e=>{ filtroLancTipo = e.target.value; renderLancamentos(); });

  document.getElementById('formLanc').addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const contaDebito = fd.get('contaDebito'), contaCredito = fd.get('contaCredito');
    const errEl = document.getElementById('lancErro');
    if(contaDebito === contaCredito){
      errEl.textContent = 'A conta de débito e a de crédito não podem ser iguais.';
      return;
    }
    errEl.textContent = '';
    const dadosForm = {
      data: fd.get('data'), historico: fd.get('historico'),
      contaDebito, contaCredito, valor: Number(fd.get('valor')),
      documento: fd.get('documento'), observacoes: fd.get('observacoes'),
      tipoOperacao: fd.get('tipoOperacao') || undefined,
    };
    if(lancamentoEditandoId){
      const alvo = getLanc().find(l=>l.id===lancamentoEditandoId);
      if(alvo){
        const resumoAntigo = `"${alvo.historico}" — ${money(alvo.valor)} (Déb: ${alvo.contaDebito} / Créd: ${alvo.contaCredito})`;
        Object.assign(alvo, dadosForm);
        await persistLancamentos();
        registrarLog('editar', 'lancamento', `Editou lançamento: ${resumoAntigo} → "${alvo.historico}" — ${money(alvo.valor)} (Déb: ${alvo.contaDebito} / Créd: ${alvo.contaCredito})`, alvo);
      }
      lancamentoEditandoId = null;
    } else {
      const novoLanc = { id: uid('l'), usuarioId: usuarioAtivoId, ...dadosForm };
      getLanc().push(novoLanc);
      await persistLancamentos();
      registrarLog('criar', 'lancamento', `Lançou: "${novoLanc.historico}" — ${money(novoLanc.valor)} (Déb: ${novoLanc.contaDebito} / Créd: ${novoLanc.contaCredito})`, novoLanc);
    }
    renderAll();
  });
}
function editarLancamento(id){
  if(!temPermissao('excluirLancamentos')){ alert('Você não tem permissão para editar lançamentos.'); return; }
  lancamentoEditandoId = id;
  renderLancamentos();
  const painel = document.getElementById('painelFormLanc');
  if(painel) painel.scrollIntoView({behavior:'smooth', block:'start'});
}
function cancelarEdicaoLancamento(){
  lancamentoEditandoId = null;
  renderLancamentos();
}
function limparFiltroLanc(){
  filtroLancTexto = '';
  filtroLancTipo = '';
  renderLancamentos();
}
async function removerLancamento(id){
  if(!temPermissao('excluirLancamentos')){ alert('Você não tem permissão para excluir lançamentos.'); return; }
  const removido = getLanc().find(l=>l.id===id);
  lancamentosPorEmpresa[empresaAtivaId] = getLanc().filter(l=>l.id!==id);
  await persistLancamentos();
  if(removido) registrarLog('excluir', 'lancamento', `Excluiu lançamento: "${removido.historico}" — ${money(removido.valor)} (Déb: ${removido.contaDebito} / Créd: ${removido.contaCredito})`, removido);
  if(lancamentoEditandoId === id) lancamentoEditandoId = null;
  renderAll();
}
async function carregarExemplos(){
  const novos = seedLancamentos(usuarioAtivoId);
  lancamentosPorEmpresa[empresaAtivaId] = getLanc().concat(novos);
  await persistLancamentos();
  registrarLog('criar', 'lancamento', `Carregou ${novos.length} lançamentos de exemplo`, {quantidade:novos.length});
  renderAll();
}
async function limparLancamentos(){
  if(!temPermissao('excluirLancamentos')){ alert('Você não tem permissão para excluir lançamentos.'); return; }
  if(!confirm('Tem certeza que deseja excluir TODOS os lançamentos desta empresa? Esta ação não pode ser desfeita.')) return;
  const removidos = getLanc();
  registrarLog('excluir', 'lancamento', `Excluiu TODOS os ${removidos.length} lançamentos da empresa "${empresaAtiva().nome}"`, {quantidade:removidos.length, lancamentos:removidos});
  lancamentosPorEmpresa[empresaAtivaId] = [];
  await persistLancamentos();
  renderAll();
}

/* ===================== RENDER: BALANCETE ===================== */
function renderBalancete(){
  const el = document.getElementById('view-balancete');
  if(!empresaAtivaId){ el.innerHTML = `<div class="panel empty">Selecione uma empresa ativa na barra acima.</div>`; return; }
  let totDeb=0, totCred=0, totDev=0, totCre=0;
  const rows = LEAVES.map(c=>{
    const s = saldoConta(c.codigo);
    totDeb+=s.deb; totCred+=s.cred; totDev+=s.dev; totCre+=s.cre;
    return {c, s};
  }).filter(r => r.s.deb!==0 || r.s.cred!==0);
  const ok = Math.abs(totDeb-totCred) < 0.005;
  el.innerHTML = `
    <div class="panel">
      <div class="stamp ${ok?'ok':'bad'}"><small>Balancete</small>${ok?'Fechado':'Divergente'}<small>${ok?'D = C':'verificar'}</small></div>
      <h3>Balancete de verificação — ${esc(empresaAtiva().nome)}</h3>
      <p class="desc">Soma dos saldos iniciais com os lançamentos do período, por conta analítica. Somente contas com movimento aparecem na lista.</p>
      <div class="table-wrap">
        <table>
          <thead><tr><th class="code">Código</th><th>Conta</th><th>Natureza</th><th class="num">Total Débitos</th><th class="num">Total Créditos</th><th class="num">Saldo Devedor</th><th class="num">Saldo Credor</th></tr></thead>
          <tbody>
          ${rows.length? rows.map(({c,s})=>`
            <tr>
              <td class="code">${esc(c.codigo)}</td>
              <td>${esc(c.nome)}</td>
              <td>${pillFor(c.natureza)}</td>
              <td class="num">${num(s.deb)}</td>
              <td class="num">${num(s.cred)}</td>
              <td class="num">${s.dev?num(s.dev):'—'}</td>
              <td class="num">${s.cre?num(s.cre):'—'}</td>
            </tr>`).join('') : `<tr><td colspan="7" class="empty">Nenhuma conta com movimento. Registre lançamentos ou saldos iniciais.</td></tr>`}
          </tbody>
          <tfoot><tr class="row-total">
            <td colspan="3">TOTAIS</td>
            <td class="num">${num(totDeb)}</td><td class="num">${num(totCred)}</td>
            <td class="num">${num(totDev)}</td><td class="num">${num(totCre)}</td>
          </tr></tfoot>
        </table>
      </div>
    </div>`;
}

      <h3>Demonstração do Resultado do Exercício — ${esc(empresaAtiva().nome)}</h3>

      ${line('(-) Despesas Financeiras', d.despFin, 'indent')}
      ${line('(=) Resultado Operacional', d.resOperacional, 'subtotal')}
      ${line('(+) Ganhos de Capital / Resultado de Investimentos', d.ganhosCapital, 'indent')}

/* ===================== RENDER: ENCERRAMENTO (ARE) ===================== */
function renderEncerramento(){
  const el = document.getElementById('view-encerramento');
  if(!empresaAtivaId){ el.innerHTML = `<div class="panel empty">Selecione uma empresa ativa na barra acima.</div>`; return; }
  const totalReceitas = credMinusDebPrefix('4');
  const totalDespesas = debMinusCredPrefix('5');
  const totalCustos = debMinusCredPrefix('6');
  const resultado = totalReceitas - totalDespesas - totalCustos;
  const lucro = resultado >= 0;
  el.innerHTML = `
    <div class="panel">
      <h3>1) Totais apurados no período por grupo de resultado — ${esc(empresaAtiva().nome)}</h3>
      <p class="desc">Esses totais são a base para o encerramento das contas de Receita, Despesa e Custo contra a conta 7.1.01 (ARE — Apuração do Resultado do Exercício).</p>
      <div class="kpi-grid">
        <div class="kpi"><div class="label">Total de Receitas (grupo 4)</div><div class="value pos">${money(totalReceitas)}</div></div>
        <div class="kpi"><div class="label">Total de Despesas (grupo 5)</div><div class="value neg">${money(totalDespesas)}</div></div>
        <div class="kpi"><div class="label">Total de Custos (grupo 6)</div><div class="value neg">${money(totalCustos)}</div></div>
        <div class="kpi"><div class="label">Resultado do Exercício</div><div class="value ${lucro?'pos':'neg'}">${money(resultado)}</div></div>
      </div>
      <table>
        <thead><tr><th class="code">Conta Débito</th><th class="code">Conta Crédito</th><th class="num">Valor</th><th>Observação</th></tr></thead>
        <tbody>
          <tr><td class="code">contas 4.*</td><td class="code">7.1.01</td><td class="num">${num(totalReceitas)}</td><td>Encerramento das contas de Receita</td></tr>
          <tr><td class="code">7.1.01</td><td class="code">contas 5.*</td><td class="num">${num(totalDespesas)}</td><td>Encerramento das contas de Despesa</td></tr>
          <tr><td class="code">7.1.01</td><td class="code">contas 6.*</td><td class="num">${num(totalCustos)}</td><td>Encerramento das contas de Custo</td></tr>
        </tbody>
      </table>
    </div>
    <div class="panel">
      <h3>2) Destinação do resultado apurado</h3>
      <table>
        <thead><tr><th class="code">Conta Débito</th><th class="code">Conta Crédito</th><th class="num">Valor</th><th>Observação</th></tr></thead>
        <tbody>
          <tr>
            <td class="code">${lucro?'7.1.01':'3.9'}</td>
            <td class="code">${lucro?'3.9':'7.1.01'}</td>
            <td class="num">${num(Math.abs(resultado))}</td>
            <td>${lucro?'Lucro do período: debita ARE e credita Resultado do Exercício (PL)':'Prejuízo do período: debita Resultado do Exercício (PL) e credita ARE'}</td>
          </tr>
        </tbody>
      </table>
      <div class="hint"><b>Observação didática:</b> por simplicidade, este roteiro trabalha por totais de grupo. No lançamento real, cada conta analítica de resultado deve ser encerrada individualmente contra a 7.1.01 (ARE) — um lançamento por conta — antes do lançamento final de destinação. Use esses valores como referência e pratique o encerramento conta a conta na aba Lançamentos.</div>
    </div>`;
}

/* ===================== RENDER: BALANÇO PATRIMONIAL ===================== */
function renderBalanco(){
  const el = document.getElementById('view-balanco');
  if(!empresaAtivaId){ el.innerHTML = `<div class="panel empty">Selecione uma empresa ativa na barra acima.</div>`; return; }
  const ativoCirc = debMinusCredPrefix('1.1');
  const ativoNaoCirc = debMinusCredPrefix('1.2');
  const totalAtivo = ativoCirc + ativoNaoCirc;
  const passivoCirc = credMinusDebPrefix('2.1');
  const passivoNaoCirc = credMinusDebPrefix('2.2');
  const pl = credMinusDebPrefix('3');
  const resultadoDRE = computeDRE().resultadoLiquido;
  const totalPassivoPL = passivoCirc + passivoNaoCirc + pl + resultadoDRE;
  const ok = Math.abs(totalAtivo - totalPassivoPL) < 0.005;
  const row = (label,val,cls='')=>`<div class="bp-row ${cls}"><span>${label}</span><span class="val">${money(val)}</span></div>`;
  el.innerHTML = `
    <div class="panel">
      <div class="stamp ${ok?'ok':'bad'}"><small>Balanço</small>${ok?'Fechado':'Divergente'}<small>A = P+PL</small></div>
      <h3>Balanço Patrimonial — ${esc(empresaAtiva().nome)}</h3>
      <p class="desc">Consolidado a partir dos saldos iniciais e dos lançamentos do período desta empresa.</p>
      <div class="bp-cols">
        <div class="bp-col">
          <h4>ATIVO</h4>
          ${row('Ativo Circulante', ativoCirc)}
          ${row('Ativo Não Circulante', ativoNaoCirc)}
          ${row('TOTAL DO ATIVO', totalAtivo, 'total')}
        </div>
        <div class="bp-col">
          <h4>PASSIVO + PATRIMÔNIO LÍQUIDO</h4>
          ${row('Passivo Circulante', passivoCirc)}
          ${row('Passivo Não Circulante', passivoNaoCirc)}
          ${row('Patrimônio Líquido', pl)}
          ${row('Resultado Líquido do Exercício (DRE)', resultadoDRE)}
          ${row('TOTAL DO PASSIVO + PL', totalPassivoPL, 'total')}
        </div>
      </div>
    </div>`;
}

/* ===================== RENDER: CONSULTA POR CONTA ===================== */
function renderConsulta(){
  const el = document.getElementById('view-consulta');
  if(!empresaAtivaId){ el.innerHTML = `<div class="panel empty">Selecione uma empresa ativa na barra acima.</div>`; return; }
  const conta = CONTA_BY_CODE[consultaCodigo];
  const movs = getLanc().filter(l=>l.contaDebito===consultaCodigo || l.contaCredito===consultaCodigo)
    .slice().sort((a,b)=> a.data.localeCompare(b.data));
  const saldos = getSaldos();
  const ini = conta ? (conta.natureza==='Credora'
      ? Number((saldos[consultaCodigo]||{}).credor||0) - Number((saldos[consultaCodigo]||{}).devedor||0)
      : Number((saldos[consultaCodigo]||{}).devedor||0) - Number((saldos[consultaCodigo]||{}).credor||0))
    : 0;
  let saldoAcum = ini;
  const linhas = movs.map(l=>{
    const isDeb = l.contaDebito===consultaCodigo;
    const efeito = conta && conta.natureza==='Credora' ? (isDeb?-1:1) : (isDeb?1:-1);
    saldoAcum += efeito*Number(l.valor);
    return {l, isDeb, saldoAcum};
  });
  const s = saldoConta(consultaCodigo);
  el.innerHTML = `
    <div class="panel">
      <h3>Selecionar conta — ${esc(empresaAtiva().nome)}</h3>
      <div class="field" style="max-width:480px;">
        <select id="consultaSelect">${contaOptions(consultaCodigo)}</select>
      </div>
    </div>
    <div class="panel">
      <h3>${esc(conta?conta.codigo+' — '+conta.nome:'')}</h3>
      <p class="desc">Natureza: ${conta?pillFor(conta.natureza):''}</p>
      <div class="kpi-grid">
        <div class="kpi"><div class="label">Total de Débitos</div><div class="value">${money(s.deb)}</div></div>
        <div class="kpi"><div class="label">Total de Créditos</div><div class="value">${money(s.cred)}</div></div>
        <div class="kpi"><div class="label">Saldo Devedor</div><div class="value pos">${s.dev?money(s.dev):'—'}</div></div>
        <div class="kpi"><div class="label">Saldo Credor</div><div class="value" style="color:var(--credit)">${s.cre?money(s.cre):'—'}</div></div>
        <div class="kpi"><div class="label">Lançamentos</div><div class="value">${movs.length}</div></div>
      </div>
      <h3 style="margin-top:6px;">Extrato (razão) — saldo acumulado</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Data</th><th>Histórico</th><th>Contrapartida</th><th class="num">Débito</th><th class="num">Crédito</th><th class="num">Saldo Acumulado</th></tr></thead>
          <tbody>
          <tr><td colspan="5"><em>Saldo inicial</em></td><td class="num">${num(ini)}</td></tr>
          ${linhas.length ? linhas.map(({l,isDeb,saldoAcum})=>{
            const contraCod = isDeb ? l.contaCredito : l.contaDebito;
            const contra = CONTA_BY_CODE[contraCod];
            return `<tr>
              <td>${fmtDate(l.data)}</td>
              <td>${esc(l.historico)}</td>
              <td class="code" title="${contra?esc(contra.nome):''}">${esc(contraCod)}</td>
              <td class="num">${isDeb?num(l.valor):'—'}</td>
              <td class="num">${!isDeb?num(l.valor):'—'}</td>
              <td class="num">${num(saldoAcum)}</td>
            </tr>`;
          }).join('') : `<tr><td colspan="6" class="empty">Nenhum lançamento para esta conta no período.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>`;
  document.getElementById('consultaSelect').addEventListener('change', e=>{ consultaCodigo = e.target.value; renderConsulta(); });
}
